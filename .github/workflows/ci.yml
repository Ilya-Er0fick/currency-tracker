name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  server:
    name: Серверная часть
    runs-on: ubuntu-latest

    # Тесты схемы работают с настоящей базой, поэтому она поднимается
    # сервисным контейнером: без неё они молча пропускаются.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Файлы не отформатированы:"
            echo "$unformatted"
            exit 1
          fi

      - name: Статический анализ
        run: go vet ./...

      - name: Сборка
        run: go build ./...

      - name: Тесты
        env:
          TEST_DATABASE_URL: postgres://tracker:tracker@localhost:5432/tracker?sslmode=disable
        run: go test ./... -count=1
